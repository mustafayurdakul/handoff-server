[project]
name = "sensorkit"
version = "0.1.0"
description = "Reads machine sensor readings from CSV and summarizes them."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
